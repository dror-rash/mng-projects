name: CI

on:
  pull_request:
  push:
    branches: [main]

# Jobs that need more permissions declare them on the job (task 082).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer PR push cancels the older run; every push to main runs to the end (its commits get scanned).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vulnerable runtime dependencies and committed secrets (task 082). Accepted advisories are in package.json's
  # pnpm.auditConfig.ignoreGhsas, each with a register line. A registry outage fails the audit; rerun it by hand.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: a PR's base..head (or a push's before..after) must be in the clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile; no install needed.
      - run: pnpm audit --prod --audit-level=high
      - run: bash infra/scripts/get-gitleaks.sh "$RUNNER_TEMP"
      - run: GITLEAKS="$RUNNER_TEMP/gitleaks" bash infra/scripts/test-secret-scan.sh
      - name: Scan the new commits for secrets
        env:
          SCAN_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: GITLEAKS="$RUNNER_TEMP/gitleaks" bash infra/scripts/scan-secrets.sh "$SCAN_BASE" "$SCAN_HEAD"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build-storybook
      # Deploy names per environment (task 068); no GCP access.
      - run: bash infra/scripts/test-environment.sh
      - run: bash infra/scripts/test-deploy-service.sh
      # The deploy's demo-seed step stays main-only and non-blocking (task 076).
      - run: bash infra/scripts/test-workflows.sh

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    # A normal run takes 4–8 minutes; a stalled apt mirror once hung it for 6 hours.
    timeout-minutes: 30
    services:
      postgres:
        # A fixed minor: the role check pins views, functions and policies by their deparsed text
        # (infra/scripts/rls-pins.mjs, computed on 16.15), so a new image can't change them under us.
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_BUCKET: app-files
      STORAGE_LOCAL_URL: http://localhost:4443
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
        timeout-minutes: 10
      - run: pnpm build
      - run: pnpm db:migrate
      # Row-level security against the migrated database (task 047).
      - run: pnpm --filter @repo/db test:db
      # The demo seed against that database (task 076): local and --deploy runs, skips and refusals.
      - run: pnpm --filter @repo/dashboard test:db
      # The deploy's database scripts (task 068): runtime role check, preview logins, migration lock, and the
      # whole sequence on Cloud SQL-like databases. One file at a time: they alter app_user in rolled-back
      # transactions.
      - run: >-
          node --experimental-strip-types --test --test-concurrency=1
          infra/scripts/check-runtime-role.test.mjs infra/scripts/provision-db-logins.test.mjs
          infra/scripts/with-db-lock.test.mjs
      - run: bash infra/scripts/test-preview-migrate.sh
      # Files (task 057): the same local storage server as docker-compose.yml. Service containers can't take
      # its flags, so it starts here.
      - run: >-
          docker run -d --name storage -p 4443:4443 -v "$PWD/packages/storage/dev-bucket:/data"
          fsouza/fake-gcs-server:1.52.2 -scheme http -port 4443 -public-host localhost:4443
          -external-url http://localhost:4443 -data /data -cors-headers Content-Type,Content-Disposition,x-goog-if-generation-match
          && timeout 30 sh -c 'until curl -sf http://localhost:4443/storage/v1/b >/dev/null; do sleep 1; done'
      - run: pnpm --filter @repo/storage test:storage
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
