name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  pull-requests: write # post preview URL

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  CLOUDSQL_CONNECTION: ${{ vars.GCP_CLOUDSQL_CONNECTION }}
  APP_URL: ${{ vars.APP_URL }}
  IS_PR: ${{ github.event_name == 'pull_request' }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  # The image builds' context: the tracked files of the commit this run checked out and migrated (task 078).
  BUILD_CONTEXT: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}

jobs:
  deploy:
    # Fork PRs can't get OIDC tokens, and Dependabot's PRs get no secrets or OIDC token either; skip both. Every
    # push to main deploys, whoever pushed (task 082).
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # Also bounds the wait for another PR's migration (with-db-lock.mjs).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Each environment has its own deployer; Workload Identity only lets a push to main use deployer-main
      # and a pull_request run use deployer-preview (infra/main.tf, attribute.deploy_target).
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ github.event_name == 'pull_request' && vars.GCP_DEPLOYER_SA_PREVIEW || vars.GCP_DEPLOYER_SA_MAIN }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Names per environment (services, image repository, database, logins, secrets) come from
      # infra/scripts/environment.sh only.
      - name: Environment
        id: env
        run: |
          . infra/scripts/environment.sh
          echo "registry=${REGION}-docker.pkg.dev/${PROJECT}/${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # 0) Database. main: migrate `app` as its owner, then provision the preview logins. Previews never touch
      #    `app` or its owner login: verify the preview logins, migrate `app_preview` as preview_owner. Both:
      #    the runtime role check as the environment's runtime login.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @repo/db... --filter @repo/e2e...
      - name: Migrate and check the database
        run: |
          . infra/scripts/environment.sh
          infra/scripts/get-cloud-sql-proxy.sh  # pinned version, checked against its sha256
          ./cloud-sql-proxy --port 5432 "$CLOUDSQL_CONNECTION" > proxy.log 2>&1 &
          for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 1; done

          secret() { gcloud secrets versions access latest --secret="$1"; }
          mask() { echo "::add-mask::$1"; }
          db_url() { echo "postgres://$1:$2@127.0.0.1:5432/$3"; }  # login, password, database
          run_node() { node --experimental-strip-types --no-warnings "$@"; }
          MIGRATE_PASSWORD="$(secret "$DB_MIGRATE_PASSWORD_SECRET")"; mask "$MIGRATE_PASSWORD"
          RUNTIME_PASSWORD="$(secret "$DB_PASSWORD_SECRET")"; mask "$RUNTIME_PASSWORD"
          MIGRATE_URL="$(db_url "$DB_MIGRATE_LOGIN" "$MIGRATE_PASSWORD" "$DB_NAME")"

          if [ "$DEPLOY_ENV" = "main" ]; then
            # Under a lock: two deploys never migrate one database at once.
            DATABASE_URL="$MIGRATE_URL" run_node infra/scripts/with-db-lock.mjs "migrate-$DB_NAME" -- pnpm db:migrate
            # The preview logins and database grants (idempotent): roles and database grants on a connection to
            # `app` (PR code can't write there), the schema grant and the migration lock on `app_preview`.
            PREVIEW_OWNER_PASSWORD="$(secret "$PREVIEW_OWNER_PASSWORD_SECRET")"; mask "$PREVIEW_OWNER_PASSWORD"
            PREVIEW_RUNTIME_PASSWORD="$(secret "$PREVIEW_RUNTIME_PASSWORD_SECRET")"; mask "$PREVIEW_RUNTIME_PASSWORD"
            MAIN_DATABASE_URL="$MIGRATE_URL" \
            DATABASE_URL="$(db_url "$MAIN_OWNER_LOGIN" "$MIGRATE_PASSWORD" "$PREVIEW_DB_NAME")" \
            PREVIEW_OWNER_PASSWORD="$PREVIEW_OWNER_PASSWORD" PREVIEW_RUNTIME_PASSWORD="$PREVIEW_RUNTIME_PASSWORD" \
              run_node infra/scripts/provision-db-logins.mjs
          else
            # Read-only: fails until a main deploy has provisioned the preview logins.
            DATABASE_URL="$MIGRATE_URL" run_node infra/scripts/provision-db-logins.mjs --verify-only
            DATABASE_URL="$MIGRATE_URL" run_node infra/scripts/with-db-lock.mjs "migrate-$DB_NAME" -- pnpm db:migrate
          fi
          # As the environment's runtime login with `-c role=app_user`: fails the deploy unless row-level
          # security really applies (ADR-0006: it isn't forced).
          DATABASE_URL="$(db_url "$DB_LOGIN" "$RUNTIME_PASSWORD" "$DB_NAME")" run_node infra/scripts/check-runtime-role.mjs
          kill %1 || true

      # 1) example-zone and dashboard first: the shell needs their URLs at build time. Each deploy pins the
      #    digest its build pushed (a tag could be moved in between). PRs deploy to the <zone>-preview services.
      #    The builds fetch BUILD_CONTEXT, the Git tree of github.sha (the commit checked out above), so the
      #    image holds tracked files only. The cache keeps final layers only (mode=min).
      - name: Build & push example-zone
        id: build_example
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          build-args: APP=example-zone
          tags: ${{ steps.env.outputs.registry }}/example-zone:${{ github.sha }}
          cache-from: type=gha,scope=example-zone
          cache-to: type=gha,scope=example-zone,mode=min
      - name: Deploy example-zone
        run: infra/scripts/deploy-service.sh example-zone "${{ steps.env.outputs.registry }}/example-zone@${{ steps.build_example.outputs.digest }}"
      - name: Resolve example-zone URL
        id: example
        run: echo "url=$(infra/scripts/service-url.sh example-zone)" >> "$GITHUB_OUTPUT"

      - name: Build & push dashboard
        id: build_dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          build-args: APP=dashboard
          tags: ${{ steps.env.outputs.registry }}/dashboard:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,scope=dashboard,mode=min
      - name: Deploy dashboard
        run: infra/scripts/deploy-service.sh dashboard "${{ steps.env.outputs.registry }}/dashboard@${{ steps.build_dashboard.outputs.digest }}"
      - name: Resolve dashboard URL
        id: dashboard
        run: echo "url=$(infra/scripts/service-url.sh dashboard)" >> "$GITHUB_OUTPUT"

      # 2) shell, pointed at those revisions (tagged pr-<N> URLs on PRs)
      - name: Check zone URLs
        env:
          EXAMPLE_URL: ${{ steps.example.outputs.url }}
          DASHBOARD_URL: ${{ steps.dashboard.outputs.url }}
        run: |
          for url in "$EXAMPLE_URL" "$DASHBOARD_URL"; do
            case "$url" in https://?*) ;; *) echo "::error::A zone URL is missing (got '$url')"; exit 1 ;; esac
          done
      - name: Build & push shell
        id: build_shell
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          build-args: |
            APP=shell
            EXAMPLE_ZONE_URL=${{ steps.example.outputs.url }}
            DASHBOARD_ZONE_URL=${{ steps.dashboard.outputs.url }}
          tags: ${{ steps.env.outputs.registry }}/shell:${{ github.sha }}
          cache-from: type=gha,scope=shell
          cache-to: type=gha,scope=shell,mode=min
      - name: Deploy shell
        run: infra/scripts/deploy-service.sh shell "${{ steps.env.outputs.registry }}/shell@${{ steps.build_shell.outputs.digest }}"
      - name: Resolve shell URL
        id: shell
        run: echo "url=$(infra/scripts/service-url.sh shell)" >> "$GITHUB_OUTPUT"
      # An empty BASE_URL would make Playwright start local servers instead of testing the preview.
      - name: Check shell URL
        env:
          SHELL_URL: ${{ steps.shell.outputs.url }}
        run: |
          case "$SHELL_URL" in https://?*) ;; *) echo "::error::The shell URL is missing (got '$SHELL_URL')"; exit 1 ;; esac

      # Demo data (task 076): main only, once the new revision serves. Seeds the DEMO_EMAIL account's workspace
      # once: `seed:demo --deploy` skips while the account hasn't signed up or opened the dashboard, or once its
      # workspace has demo data. Runs as `app`'s owner, with the password the migration step reads (no new
      # identity). Never blocks main: a skip is a notice, a refusal or failure a warning. The log is public: the
      # password and email are masked first, DATABASE_URL lives only in the seed command's environment, and
      # `pnpm --silent` keeps the command line (with the email) out of the log.
      - name: Seed demo data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        env:
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
        run: |
          if [ -z "$DEMO_EMAIL" ]; then
            echo "::notice title=Demo data::Skipped: the DEMO_EMAIL repository secret isn't set."
            exit 0
          fi
          echo "::add-mask::$DEMO_EMAIL"
          fail() { echo "::warning title=Demo data::$1"; exit 1; }
          oneline() { tr '\n' ' ' | cut -c1-500; }
          . infra/scripts/environment.sh
          PASSWORD="$(gcloud secrets versions access latest --secret="$DB_MIGRATE_PASSWORD_SECRET")" ||
            fail "Couldn't read the database password."
          echo "::add-mask::$PASSWORD"
          pnpm install --frozen-lockfile --filter @repo/dashboard... || fail "Installing the dashboard failed."
          # The binary the migration step downloaded; its proxy was stopped there.
          ./cloud-sql-proxy --port 5432 "$CLOUDSQL_CONNECTION" > proxy-seed.log 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 1; done
          (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null ||
            fail "The Cloud SQL proxy didn't start: $(tail -c 300 proxy-seed.log | oneline)"

          set +e
          OUT="$(DATABASE_URL="postgres://${DB_MIGRATE_LOGIN}:${PASSWORD}@127.0.0.1:5432/${DB_NAME}" DB_POOL_MAX=1 \
            pnpm --silent --filter @repo/dashboard seed:demo --deploy --email "$DEMO_EMAIL" 2> "$RUNNER_TEMP/seed.err")"
          CODE=$?
          set -e
          [ "$CODE" -eq 0 ] || fail "$(oneline < "$RUNNER_TEMP/seed.err") (exit $CODE)"
          case "$OUT" in
            Skipped:*) echo "::notice title=Demo data::$(echo "$OUT" | oneline)" ;;
            *) echo "$OUT" ;;
          esac

      # 3) Acceptance tests against the deployed preview: the @smoke set and the @poc flow (task 069). The full
      #    suite needs AUTH_DISABLE_RATE_LIMIT, which a deployment never sets (rule 13). One worker: the set signs
      #    up and logs in from one runner IP, against production rate limits, and the e2e helpers space sign-ups
      #    and sign-ins on one timeline in the process (e2e/steps/fixtures.ts). Every step these scenarios use
      #    goes through the app only (the runner has BASE_URL, no database or storage settings). The report and
      #    traces stay on the runner: the repository is public, and failed traces hold the throwaway accounts'
      #    passwords and cookies.
      - if: env.IS_PR == 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
        timeout-minutes: 10
      - name: Run Playwright @smoke and @poc against preview
        if: env.IS_PR == 'true'
        working-directory: e2e
        run: pnpm exec bddgen && pnpm exec playwright test --workers=1 --trace=off
        env:
          BASE_URL: ${{ steps.shell.outputs.url }}
          E2E_TAGS: "(@smoke or @poc) and not @wip"
      - name: Comment preview URL
        if: env.IS_PR == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body "Preview: ${{ steps.shell.outputs.url }} (commit ${GITHUB_SHA::7})"
