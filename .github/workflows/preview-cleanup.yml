name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    # Dependabot's runs get no OIDC token (task 082); its PRs have no preview to clean up (deploy.yml skips them).
    # A Dependabot PR a human pushed to (so it got a preview) and Dependabot then closed keeps its tags: remove by hand.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IS_PR: "true"
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA_PREVIEW }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      # Only the <zone>-preview services (environment.sh). A tag that isn't there (the PR's deploy never got
      # that far) is reported as a notice; any other failure is logged and fails the job.
      - name: Remove pr-${{ github.event.pull_request.number }} tags from the preview services
        run: |
          . infra/scripts/environment.sh
          status=0
          for zone in shell example-zone dashboard; do
            service="$(service_name "$zone")"
            if ! out="$(gcloud run services update-traffic "$service" --region "$REGION" --remove-tags "pr-${PR_NUMBER}" --quiet 2>&1)"; then
              if gcloud run services describe "$service" --region "$REGION" --format=json \
                  | jq -e --arg tag "pr-${PR_NUMBER}" '[.status.traffic[]? | select(.tag == $tag)] | length == 0' >/dev/null; then
                echo "::notice::$service has no pr-${PR_NUMBER} tag"
              else
                echo "::error::Couldn't remove pr-${PR_NUMBER} from $service: $out"
                status=1
              fi
            fi
          done
          exit "$status"
